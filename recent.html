<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Searches | Campus Event Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Top Red Bar with Back Button, Search Bar, Profile -->
    <div class="search-top-bar">
        <button class="back-btn" onclick="location.href='index.html'">←</button>
        <div class="search-wrapper-center">
            <form action="search.html" method="get">
                <input type="text" name="query" class="search-bar" placeholder="Search events...">
            </form>
        </div>
        <div class="profile-icon" onclick="location.href='profile.html'">👤</div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="recent-searches-container">
            <!-- Recent Searches Header with Underline -->
            <div class="recent-header">
                <h2 class="recent-title">recent searches</h2>
                <div class="recent-underline"></div>
            </div>

            <!-- Recent Searches List -->
            <div class="recent-list" id="recentList">
                <!-- Recent searches will be dynamically added here via JS -->
            </div>

            <!-- Clear All Button -->
            <div class="clear-all-container">
                <button class="clear-all-btn" id="clearAllBtn">clear all</button>
            </div>
        </div>

        <!-- Right Side: York U Image Grid -->
        <div class="image-grid-sidebar">
            <div class="image-grid">
                <img src="https://www.yorku.ca/global-engagement/wp-content/uploads/sites/74/2024/05/vari-drone-1.jpeg" alt="York University" class="grid-img">
                <img src="https://torontosocietyofarchitects.ca/wp-content/uploads/2022/08/york-university-station-01-toronto-society-of-architects-adamson.jpg" alt="York University" class="grid-img">
                <img src="https://www.edumasters.in/media/canada/york-university-toronto/york-university-toronto-college-36.jpg" alt="York University" class="grid-img">
                <img src="https://images.shiksha.com/mediadata/images/1700643467phpORrdxn.jpeg" alt="York University" class="grid-img">
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <img src="images/footer.png" alt="York University Footer" class="footer-img">
            <div class="footer-info">
                <p>York University | Keele Campus | 4700 Keele Street, Toronto, ON M3J 1P3</p>
                <p>© 2026 Campus Event Finder | All Rights Reserved</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
